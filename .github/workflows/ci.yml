name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koshereats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/koshereats_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/koshereats_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  web:
    name: Web (Next.js / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  android:
    name: Android (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [consumer, seller]
    defaults:
      run:
        working-directory: android/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The consumer app applies the com.google.gms.google-services plugin (for
      # FCM + Crashlytics + Analytics), which hard-requires app/google-services.json
      # at build time. That file is environment config and is gitignored, so a clean
      # CI checkout has none and :app:processDebugGoogleServices fails before Kotlin
      # compiles. CI only type-checks (it never runs the app or talks to Firebase),
      # so a minimal placeholder with the correct package_name satisfies the plugin.
      # Seller/courier do manual FCM init (no plugin) and don't need this. Real
      # builds use the actual file from local / release config.
      - name: Provide placeholder google-services.json (CI compile only)
        if: matrix.app == 'consumer'
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "koshereats-ci-placeholder",
              "storage_bucket": "koshereats-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.koshereats.consumer" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyACIplaceholderkeyplaceholderke1234" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Compile Kotlin (debug)
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

  openapi-validate:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check spec exists
        id: spec
        run: |
          if [ -f backend/openapi.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::backend/openapi.yaml not found — skipping OpenAPI lint."
          fi

      - name: Set up Node
        if: steps.spec.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint OpenAPI spec
        if: steps.spec.outputs.exists == 'true'
        run: npx --yes @redocly/cli@latest lint backend/openapi.yaml

  ios-build:
    name: iOS build (slow lane)
    runs-on: macos-15
    # Slow lane: do not block merges on the iOS compile.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: consumer
            project: ios/consumer/KosherEatsConsumer.xcodeproj
            scheme: KosherEatsConsumer
          - app: seller
            project: ios/seller/KosherEatsSeller.xcodeproj
            scheme: KosherEatsSeller
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build ${{ matrix.app }} scheme
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify
        shell: bash
