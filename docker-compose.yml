version: "3.9"

services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Inside the docker network, the DB and Redis live at their service
      # names, not localhost. These override whatever is in .env so local
      # `go run` (which uses localhost) and `docker compose` both work.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/koshereats?sslmode=disable
      REDIS_URL: redis://redis:6379
      # JWT_SECRET must be set — fall through from .env, but make it
      # explicit here so docker compose fails loudly if missing.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: koshereats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/internal/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
