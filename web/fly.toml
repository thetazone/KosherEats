# Fly.io config for the KosherEats Next.js web app (consumer + admin).
# Deploy with:
#   cd web && fly launch --no-deploy
#   fly secrets set NEXT_PUBLIC_API_URL=https://koshereats-api.fly.dev/api/v1
#   fly deploy

app = "koshereats-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
