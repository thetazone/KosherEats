name: GreenEatsCourier
options:
  bundleIdPrefix: com.greeneats
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "4RSM8W4755"

targets:
  GreenEatsCourier:
    type: application
    platform: iOS
    sources:
      - GreenEatsCourier
    scheme:
      testTargets: []
      gatherCoverageData: false
    settings:
      base:
        INFOPLIST_FILE: GreenEatsCourier/Info.plist
        CODE_SIGN_ENTITLEMENTS: GreenEatsCourier/GreenEatsCourier.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.greeneats.courier
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "GreenEats Courier uses your location to show nearby deliveries and navigate to pickups."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "GreenEats Courier needs background location to keep customers updated on delivery progress."
        INFOPLIST_KEY_UIBackgroundModes: "location fetch"
        INFOPLIST_KEY_NSCameraUsageDescription: "GreenEats Courier needs camera access to capture your drivers license and vehicle documents."
    dependencies:
      - sdk: AuthenticationServices.framework
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
