name: KosherEatsSeller
options:
  bundleIdPrefix: com.koshereats
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "4RSM8W4755"

targets:
  KosherEatsSeller:
    type: application
    platform: iOS
    sources:
      - KosherEatsSeller
    settings:
      base:
        INFOPLIST_FILE: KosherEatsSeller/Info.plist
        CODE_SIGN_ENTITLEMENTS: KosherEatsSeller/KosherEatsSeller.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.koshereats.seller
        MARKETING_VERSION: "4.2"
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # UISupportedInterfaceOrientations is now set in Info.plist directly
        # (both iPhone + iPad arrays) so Apple's upload validator sees them.
        # The INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone build
        # setting wasn't making it into the final bundle for some reason,
        # tripping the "No orientations were specified" upload rejection.
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: AuthenticationServices.framework

# Explicit shared scheme — without this, xcodegen deletes the
# previously-tracked KosherEatsSeller.xcscheme on every regen, and
# Xcode Cloud / `xcodebuild -scheme` stop working until someone
# manually restores the file. Pinned here so the scheme survives
# regenerations.
schemes:
  KosherEatsSeller:
    build:
      targets:
        KosherEatsSeller: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
