name: KosherEatsConsumer
options:
  bundleIdPrefix: com.koshereats
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"
  StripePaymentSheet:
    url: https://github.com/stripe/stripe-ios
    from: "25.11.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "4RSM8W4755"

targets:
  KosherEatsConsumer:
    type: application
    platform: iOS
    sources:
      - KosherEatsConsumer
    settings:
      base:
        INFOPLIST_FILE: KosherEatsConsumer/Info.plist
        CODE_SIGN_ENTITLEMENTS: KosherEatsConsumer/KosherEatsConsumer.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.koshereats.consumer
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "14"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "KosherEats needs your location to find nearby restaurants"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: StripePaymentSheet
        product: StripePaymentSheet
      - package: StripePaymentSheet
        product: StripeApplePay
      - sdk: AuthenticationServices.framework
      - sdk: PassKit.framework
      - target: DeliveryActivity

  DeliveryActivity:
    type: app-extension
    platform: iOS
    sources:
      - DeliveryActivity
      - path: KosherEatsConsumer/Models/DeliveryAttributes.swift
    info:
      path: DeliveryActivity/Info.plist
      properties:
        CFBundleDisplayName: DeliveryActivity
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koshereats.consumer.DeliveryActivity
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "14"
