name: KosherEatsConsumer
options:
  bundleIdPrefix: com.koshereats
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"
  FacebookLogin:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "17.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  KosherEatsConsumer:
    type: application
    platform: iOS
    sources:
      - KosherEatsConsumer
    settings:
      base:
        INFOPLIST_FILE: KosherEatsConsumer/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.koshereats.consumer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "KosherEats needs your location to find nearby restaurants"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: FacebookLogin
        product: FacebookLogin
      - sdk: AuthenticationServices.framework
