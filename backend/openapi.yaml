    post:
      tags: [webhooks]
      summary: DoorDash Drive delivery-status webhook
      security: []
      responses:
        "200": { description: Acknowledged }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema: { type: string }
    RestaurantIdPath:
      in: path
      name: restaurant_id
      required: true
      schema: { type: string }
    VerticalQuery:
      in: query
      name: vertical
      description: Branded app scope; defaults to 'kosher'. Ignored when authenticated (JWT claim wins).
      schema: { type: string, enum: [kosher, vegan] }
    SellerRestaurantQuery:
      in: query
      name: restaurant_id
      description: Target restaurant; omitted falls back to the seller's first owned restaurant.
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthTokenResponse:
      description: Authentication tokens + user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResponse" }
    OrderResponse:
      description: Updated order
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Order" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    UserRole:
      type: string
      enum: [consumer, seller, admin, courier]

    OrderStatus:
      type: string
      enum: [scheduled, pending, accepted, preparing, ready, picked_up, delivered, completed, cancelled, rejected]

    VehicleType:
      type: string
      enum: [car, bike, scooter, motorcycle, walk]

    DiscountType:
      type: string
      enum: [percentage, fixed, bogo]

    KosherCertification:
      type: string
      enum: [OU, OK, Kof-K, Star-K, cRc, Badatz, Chof-K, other]

    AuthResponse:
      type: object
      properties:
        token: { type: string, description: JWT access token }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    RegisterRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        vertical: { type: string, description: "'kosher' (default) or 'vegan'" }
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        vertical: { type: string }
      required: [email, password]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        vertical: { type: string }
        avatar_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Address:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        label: { type: string }
        street: { type: string }
        apt: { type: string }
        city: { type: string }
        state: { type: string }
        zip_code: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        is_default: { type: boolean }

    Restaurant:
      type: object
      properties:
        id: { type: string }
        owner_id: { type: string }
        name: { type: string }
        description: { type: string }
        image_url: { type: string }
        cover_image_url: { type: string }
        logo_url: { type: string }
        phone: { type: string }
        email: { type: string }
        street: { type: string }
        city: { type: string }
        state: { type: string }
        zip_code: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        kosher_certification: { $ref: "#/components/schemas/KosherCertification" }
        certifying_agency: { type: string }
        is_cholov_yisroel: { type: boolean }
        is_pas_yisroel: { type: boolean }
        is_glatt_kosher: { type: boolean }
        kosher_certificate_url: { type: string }
        cuisine_type:
          type: array
          items: { type: string }
        rating: { type: number, format: double }
        review_count: { type: integer }
        delivery_fee: { type: integer, description: cents }
        min_order: { type: integer, description: cents }
        est_delivery_min: { type: integer, description: minutes }
        est_delivery_max: { type: integer, description: minutes }
        is_open: { type: boolean }
        is_active: { type: boolean }
        approval_status: { type: string, enum: [pending, approved, rejected] }
        delivery_mode: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MenuCategory:
      type: object
      properties:
        id: { type: string }
        restaurant_id: { type: string }
        name: { type: string }
        sort_order: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }

    MenuItem:
      type: object
      properties:
        id: { type: string }
        restaurant_id: { type: string }
        category_id: { type: string }
        name: { type: string }
        description: { type: string }
        image_url: { type: string }
        price: { type: integer, description: cents }
        is_meat: { type: boolean }
        is_dairy: { type: boolean }
        is_pareve: { type: boolean }
        is_available: { type: boolean }
        sort_order: { type: integer }
        modifier_groups:
          type: array
          items: { $ref: "#/components/schemas/ModifierGroup" }

    ModifierGroup:
      type: object
      properties:
        id: { type: string }
        menu_item_id: { type: string }
        name: { type: string }
        description: { type: string }
        is_required: { type: boolean }
        min_selections: { type: integer }
        max_selections: { type: integer }
        sort_order: { type: integer }
        modifiers:
          type: array
          items: { $ref: "#/components/schemas/Modifier" }

    Modifier:
      type: object
      properties:
        id: { type: string }
        group_id: { type: string }
        name: { type: string }
        price_delta: { type: integer, description: "cents; may be negative" }
        is_default: { type: boolean }
        is_available: { type: boolean }
        sort_order: { type: integer }

    SelectedModifier:
      type: object
      description: Snapshot of a chosen modifier (name + price copied at selection time).
      properties:
        id: { type: string }
        group_id: { type: string }
        group_name: { type: string }
        name: { type: string }
        price_delta: { type: integer, description: cents }

    Cart:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        restaurant_id: { type: string }
        subtotal: { type: integer, description: cents }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }

    CartItem:
      type: object
      properties:
        id: { type: string }
        cart_id: { type: string }
        menu_item_id: { type: string }
        name: { type: string }
        price: { type: integer, description: "per-unit cents, includes modifier deltas" }
        quantity: { type: integer }
        notes: { type: string }
        selected_modifiers:
          type: array
          items: { $ref: "#/components/schemas/SelectedModifier" }

    CreateOrderRequest:
      type: object
      properties:
        restaurant_id: { type: string }
        delivery_address: { type: string }
        delivery_lat: { type: number, format: double }
        delivery_lng: { type: number, format: double }
        payment_intent_id: { type: string }
        tip: { type: integer, description: cents }
        scheduled_for: { type: string, format: date-time, nullable: true, description: "null = ASAP" }
        fulfillment_type: { type: string, enum: [delivery, pickup] }
        applied_deal_id: { type: string }

    Order:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        restaurant_id: { type: string }
        restaurant_name: { type: string }
        restaurant_lat: { type: number, format: double }
        restaurant_lng: { type: number, format: double }
        status: { $ref: "#/components/schemas/OrderStatus" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal: { type: integer, description: cents }
        discount: { type: integer, description: "deal discount, cents" }
        delivery_fee: { type: integer, description: cents }
        service_fee: { type: integer, description: cents }
        tax: { type: integer, description: cents }
        total: { type: integer, description: cents }
        delivery_address: { type: string }
        delivery_lat: { type: number, format: double }
        delivery_lng: { type: number, format: double }
        stripe_payment_id: { type: string }
        est_delivery_time: { type: string, format: date-time }
        courier_id: { type: string, nullable: true }
        courier:
          description: Assigned courier (null until claimed).
          allOf: [{ $ref: "#/components/schemas/CourierPublic" }]
        claimed_at: { type: string, format: date-time, nullable: true }
        picked_up_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        courier_payout: { type: integer, description: cents }
        courier_tip: { type: integer, description: cents }
        courier_rating: { type: integer, nullable: true }
        customer_name: { type: string }
        customer_phone: { type: string }
        delivery_proof_url: { type: string }
        fulfillment_type: { type: string, enum: [delivery, pickup] }
        external_delivery_id: { type: string, nullable: true }
        external_provider: { type: string, nullable: true }
        external_tracking_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderItem:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        menu_item_id: { type: string }
        name: { type: string }
        price: { type: integer, description: "per-unit cents, includes modifier deltas" }
        quantity: { type: integer }
        notes: { type: string }
        selected_modifiers:
          type: array
          items: { $ref: "#/components/schemas/SelectedModifier" }

    CreatePaymentIntentRequest:
      type: object
      description: All fields optional; server derives the total from the cart.
      properties:
        tip: { type: integer, description: cents }
        fulfillment_type: { type: string, enum: [delivery, pickup] }
        restaurant_id: { type: string }
        delivery_address: { type: string }
        applied_deal_id: { type: string }

    PaymentSheetBundle:
      type: object
      description: Everything the iOS Stripe PaymentSheet / CustomerSheet needs.
      properties:
        payment_intent_secret: { type: string }
        ephemeral_key_secret: { type: string }
        customer_id: { type: string }
        publishable_key: { type: string }
        default_card_brand: { type: string }
        default_card_last4: { type: string }

    PaymentIntentResponse:
      type: object
      description: PaymentSheet bundle fields plus the server-computed price breakdown.
      properties:
        payment_intent_secret: { type: string }
        ephemeral_key_secret: { type: string }
        customer_id: { type: string }
        publishable_key: { type: string }
        subtotal: { type: integer, description: cents }
        discount: { type: integer, description: cents }
        applied_deal_id: { type: string }
        delivery_fee: { type: integer, description: cents }
        service_fee: { type: integer, description: cents }
        tax: { type: integer, description: cents }
        tip: { type: integer, description: cents }
        total: { type: integer, description: cents }

    Deal:
      type: object
      properties:
        id: { type: string }
        restaurant_id: { type: string }
        title: { type: string }
        description: { type: string }
        image_url: { type: string }
        menu_item_id: { type: string, nullable: true }
        discount_type: { $ref: "#/components/schemas/DiscountType" }
        discount_value: { type: integer }
        min_order_amount: { type: integer, nullable: true, description: cents }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DealWithItem:
      allOf:
        - $ref: "#/components/schemas/Deal"
        - type: object
          properties:
            restaurant_name: { type: string }
            restaurant_image_url: { type: string }
            menu_item_name: { type: string, nullable: true }
            menu_item_price: { type: integer, nullable: true, description: cents }
            menu_item_image_url: { type: string, nullable: true }

    CreateDealRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        image_url: { type: string }
        menu_item_id: { type: string, nullable: true }
        discount_type: { $ref: "#/components/schemas/DiscountType" }
        discount_value: { type: integer }
        min_order_amount: { type: integer, nullable: true }
        starts_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time }
      required: [title, discount_type, discount_value, expires_at]

    MenuImport:
      type: object
      description: Async menu-import job (e.g. from an UberEats store URL).
      properties:
        id: { type: string }
        restaurant_id: { type: string }
        source: { type: string, example: ubereats }
        source_url: { type: string, format: uri }
        status: { type: string, enum: [pending, running, done, failed] }
        items_total: { type: integer }
        items_created: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DashboardStats:
      type: object
      properties:
        today_orders: { type: integer }
        today_revenue: { type: integer, description: cents }
        active_orders: { type: integer }
        avg_prep_time: { type: number, format: double, description: minutes }

    CourierProfile:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        onboarding_status:
          type: string
          enum: [pending_info, pending_documents, pending_background, approved, rejected, suspended]
        phone_verified: { type: boolean }
        vehicle_type: { $ref: "#/components/schemas/VehicleType" }
        vehicle_make: { type: string }
        vehicle_model: { type: string }
        vehicle_year: { type: integer }
        vehicle_color: { type: string }
        license_plate: { type: string }
        drivers_license_url: { type: string }
        drivers_license_number: { type: string }
        insurance_url: { type: string }
        vehicle_registration_url: { type: string }
        profile_photo_url: { type: string }
        background_check_status: { type: string }
        payout_ready: { type: boolean }
        is_online: { type: boolean }
        last_lat: { type: number, format: double }
        last_lng: { type: number, format: double }
        last_location_at: { type: string, format: date-time, nullable: true }
        total_deliveries: { type: integer }
        rating: { type: number, format: double }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CourierPublic:
      type: object
      description: Trimmed courier view shown to consumers/sellers on an assigned order.
      properties:
        id: { type: string }
        first_name: { type: string }
        phone: { type: string }
        avatar_url: { type: string }
        vehicle_type: { $ref: "#/components/schemas/VehicleType" }
        vehicle_make: { type: string }
        vehicle_model: { type: string }
        vehicle_color: { type: string }
        license_plate: { type: string }
        rating: { type: number, format: double }
        total_deliveries: { type: integer }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    CourierLocationPing:
      type: object
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        heading: { type: number, format: double }
        speed: { type: number, format: double }

    ChatMessage:
      type: object
      description: One message in an order-scoped chat thread.
      properties:
        id: { type: string }
        order_id: { type: string }
        sender_id: { type: string }
        sender_role: { $ref: "#/components/schemas/UserRole" }
        body: { type: string }
        created_at: { type: string, format: date-time }
