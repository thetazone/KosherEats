# ─────────────────────────────────────────────────────────────────────────────
# KosherEats / Mamiye-Eats backend HTTP API — OpenAPI 3.0 spec
#
# GENERATED / HAND-CURATED to anchor typed clients (iOS/Android/web).
# Source of truth: backend/cmd/api/main.go (route registrations) and
# backend/internal/models/models.go (+ handler request/response structs).
# JSON field names are snake_case exactly as the Go structs serialize them.
#
# This file is the contract, not the implementation. When a route or model
# changes in Go, update this spec in the same change. Validate with any
# OpenAPI 3.0 tool (e.g. `npx @redocly/cli lint backend/openapi.yaml` or
# `swagger-cli validate backend/openapi.yaml`).
# ─────────────────────────────────────────────────────────────────────────────
openapi: 3.0.3
info:
  title: KosherEats API
  version: "1.0.0"
  description: >
    HTTP API for the KosherEats / GreenEats food-delivery platform. Serves the
    consumer, seller, courier, and admin apps. All money fields are integer
    cents unless noted. Most paths are under /api/v1; auth is a Bearer JWT
    obtained from the /api/v1/auth endpoints.

servers:
  - url: http://localhost:8080
    description: Local dev
  - url: https://koshereats-api.fly.dev
    description: Production (Fly.io)

tags:
  - name: health
  - name: auth
  - name: restaurants
  - name: cart
  - name: orders
  - name: payments
  - name: favorites
  - name: deals
  - name: user
  - name: seller
  - name: courier
  - name: admin
  - name: devices
  - name: uploads
  - name: webhooks

security:
  - bearerAuth: []

paths:
  # ── Health ────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [health]
      summary: Liveness/readiness probe (pings the DB)
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "503":
          description: Degraded (DB unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: degraded }
                  reason: { type: string }

  # ── Auth (public, per-IP rate limited) ────────────────────────────────────
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthTokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email + password (scoped by role + vertical)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a fresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200": { $ref: "#/components/responses/AuthTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/social:
    post:
      tags: [auth]
      summary: Sign in / up with a social provider (Apple, Google)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [apple, google] }
                id_token: { type: string }
                role: { $ref: "#/components/schemas/UserRole" }
                vertical: { type: string }
              required: [provider, id_token]
      responses:
        "200": { $ref: "#/components/responses/AuthTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/email/check:
    post:
      tags: [auth]
      summary: Check whether an account exists for an (email, role, vertical)
      description: >
        Account-existence oracle used by the unified email entry screen to route
        to "enter password" vs "create account". Per-IP rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/UserRole" }
                vertical: { type: string }
              required: [email]
      responses:
        "200":
          description: Existence result
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists: { type: boolean }

  /api/v1/auth/phone/start:
    post:
      tags: [auth]
      summary: Start phone-OTP login (sends SMS via Twilio Verify)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
              required: [phone]
      responses:
        "200": { description: SMS sent }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/auth/phone/verify:
    post:
      tags: [auth]
      summary: Verify phone-OTP code and return a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                code: { type: string }
              required: [phone, code]
      responses:
        "200": { $ref: "#/components/responses/AuthTokenResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a 6-digit password-reset code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/UserRole" }
                vertical: { type: string }
              required: [email]
      responses:
        "200": { description: Code emailed (always 200 to avoid enumeration) }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      summary: Reset password using the emailed code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                code: { type: string }
                new_password: { type: string }
              required: [email, code, new_password]
      responses:
        "200": { description: Password updated }
        "400": { $ref: "#/components/responses/Error" }

  # ── Restaurants (public, optional auth) ───────────────────────────────────
  /api/v1/restaurants:
    get:
      tags: [restaurants]
      summary: List restaurants in the caller's vertical
      security: []
      parameters:
        - { $ref: "#/components/parameters/VerticalQuery" }
        - in: query
          name: lat
          schema: { type: number, format: double }
        - in: query
          name: lng
          schema: { type: number, format: double }
      responses:
        "200":
          description: Restaurant list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Restaurant" }

  /api/v1/restaurants/search:
    get:
      tags: [restaurants]
      summary: Full-text restaurant search
      security: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - { $ref: "#/components/parameters/VerticalQuery" }
      responses:
        "200":
          description: Matching restaurants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Restaurant" }

  /api/v1/restaurants/suggested:
    get:
      tags: [restaurants]
      summary: Suggested / featured restaurants
      security: []
      parameters:
        - { $ref: "#/components/parameters/VerticalQuery" }
      responses:
        "200":
          description: Suggested restaurants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Restaurant" }

  /api/v1/restaurants/{id}:
    get:
      tags: [restaurants]
      summary: Get a single restaurant
      security: []
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Restaurant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/restaurants/{id}/menu:
    get:
      tags: [restaurants]
      summary: Get a restaurant's menu (categories with items)
      security: []
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Menu categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuCategory" }

  /api/v1/restaurants/{id}/deals:
    get:
      tags: [restaurants, deals]
      summary: List active deals for a restaurant
      security: []
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DealWithItem" }

  # ── Deals (public, consumer "Deals" tab) ──────────────────────────────────
  /api/v1/deals/nearby:
    get:
      tags: [deals]
      summary: List active deals near a location
      security: []
      parameters:
        - in: query
          name: lat
          schema: { type: number, format: double }
        - in: query
          name: lng
          schema: { type: number, format: double }
        - { $ref: "#/components/parameters/VerticalQuery" }
      responses:
        "200":
          description: Nearby deals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DealWithItem" }

  # ── Delivery quote (auth) ─────────────────────────────────────────────────
  /api/v1/delivery-quote:
    post:
      tags: [orders]
      summary: Quote a delivery fee for a restaurant + address pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restaurant_id: { type: string }
                delivery_address: { type: string }
                delivery_lat: { type: number, format: double }
                delivery_lng: { type: number, format: double }
      responses:
        "200":
          description: Fee quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_fee: { type: integer, description: cents }
        "401": { $ref: "#/components/responses/Error" }

  # ── Cart (auth) ───────────────────────────────────────────────────────────
  /api/v1/cart:
    get:
      tags: [cart]
      summary: Get the current user's cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      tags: [cart]
      summary: Clear the cart
      responses:
        "200": { description: Cart cleared }

  /api/v1/cart/items:
    post:
      tags: [cart]
      summary: Add an item to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                menu_item_id: { type: string }
                quantity: { type: integer, minimum: 1 }
                notes: { type: string }
                selected_modifiers:
                  type: array
                  items: { $ref: "#/components/schemas/SelectedModifier" }
              required: [menu_item_id, quantity]
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/cart/items/{id}:
    patch:
      tags: [cart]
      summary: Update a cart item's quantity/notes
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 1 }
                notes: { type: string }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      tags: [cart]
      summary: Remove a cart item
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  # ── Orders (auth) ─────────────────────────────────────────────────────────
  /api/v1/orders:
    get:
      tags: [orders]
      summary: List the current user's orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      tags: [orders]
      summary: Create an order from the current cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/orders/by-payment-intent/{pi}:
    get:
      tags: [orders]
      summary: Look up an order by its Stripe PaymentIntent id (idempotent recovery)
      parameters:
        - in: path
          name: pi
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orders/{id}:
    get:
      tags: [orders]
      summary: Get a single order
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orders/{id}/cancel:
    patch:
      tags: [orders]
      summary: Cancel an order
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/orders/{id}/rating:
    post:
      tags: [orders]
      summary: Rate a completed order / its courier
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
              required: [rating]
      responses:
        "200": { description: Rating recorded }

  /api/v1/orders/{id}/location/stream:
    get:
      tags: [orders]
      summary: Server-Sent Events stream of the courier's live location
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: SSE stream (text/event-stream); each event is a CourierLocationPing
          content:
            text/event-stream:
              schema: { type: string }

  /api/v1/orders/{id}/chat:
    get:
      tags: [orders]
      summary: List chat messages for an order
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      tags: [orders]
      summary: Send a chat message on an order thread
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
              required: [body]
      responses:
        "200":
          description: Created message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }

  # ── Payments (auth) ───────────────────────────────────────────────────────
  /api/v1/payments/intent:
    post:
      tags: [payments]
      summary: Create a PaymentIntent + PaymentSheet bundle for the current cart
      description: >
        Computes the authoritative total server-side from the cart (the client
        only supplies tip + fulfillment + optional deal/address). Returns the
        PaymentSheet bundle plus the full price breakdown.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentIntentRequest" }
      responses:
        "200":
          description: PaymentSheet bundle + price breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntentResponse" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/payments/confirm:
    post:
      tags: [payments]
      summary: No-op confirm (confirmation happens client-side via PaymentSheet)
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: confirmed }

  /api/v1/payments/customer:
    get:
      tags: [payments]
      summary: Get a Stripe customer bundle for STPCustomerSheet (saved cards)
      responses:
        "200":
          description: Customer bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSheetBundle" }

  /api/v1/payments/setup-intent:
    post:
      tags: [payments]
      summary: Create a SetupIntent client_secret for adding a card
      responses:
        "200":
          description: SetupIntent client secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret: { type: string }

  # ── Favorites (auth) ──────────────────────────────────────────────────────
  /api/v1/favorites:
    get:
      tags: [favorites]
      summary: List favorited restaurants
      responses:
        "200":
          description: Favorites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Restaurant" }

  /api/v1/favorites/ids:
    get:
      tags: [favorites]
      summary: List favorited restaurant ids
      responses:
        "200":
          description: Favorite ids
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/v1/favorites/{restaurant_id}:
    post:
      tags: [favorites]
      summary: Add a favorite
      parameters:
        - { $ref: "#/components/parameters/RestaurantIdPath" }
      responses:
        "200": { description: Added }
    delete:
      tags: [favorites]
      summary: Remove a favorite
      parameters:
        - { $ref: "#/components/parameters/RestaurantIdPath" }
      responses:
        "200": { description: Removed }

  # ── User profile (auth) ───────────────────────────────────────────────────
  /api/v1/user/profile:
    get:
      tags: [user]
      summary: Get the current user's profile
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    put:
      tags: [user]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
                avatar_url: { type: string }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/v1/user/addresses:
    get:
      tags: [user]
      summary: List saved addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Address" }
    post:
      tags: [user]
      summary: Add an address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: Created address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }

  /api/v1/user/addresses/{id}:
    delete:
      tags: [user]
      summary: Delete an address
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200": { description: Deleted }

  /api/v1/user/addresses/{id}/default:
    patch:
      tags: [user]
      summary: Set an address as the default
      parameters:
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200": { description: Default set }

  /api/v1/user/notification-preferences:
    get:
      tags: [user]
      summary: Get notification preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: boolean } }
    put:
      tags: [user]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: boolean } }
      responses:
        "200": { description: Updated }

  /api/v1/user/account:
    delete:
      tags: [user]
      summary: Delete the current user's account
      responses:
        "200": { description: Account deleted }

  /api/v1/user/linked-providers:
    get:
      tags: [user]
      summary: List linked auth providers
      responses:
        "200":
          description: Linked providers
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
    post:
      tags: [user]
      summary: Link an auth provider to the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string }
                id_token: { type: string }
              required: [provider, id_token]
      responses:
        "200": { description: Linked }

  /api/v1/user/linked-providers/{provider}:
    delete:
      tags: [user]
      summary: Unlink an auth provider
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        "200": { description: Unlinked }

  # ── Seller (auth + seller role) ───────────────────────────────────────────
  /api/v1/seller/restaurants:
    get:
      tags: [seller]
      summary: List the seller's restaurants
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Restaurant" }
    post:
      tags: [seller]
      summary: Create a restaurant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Restaurant" }
      responses:
        "200":
          description: Created restaurant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }

  /api/v1/seller/restaurant:
    get:
      tags: [seller]
      summary: Get a seller's restaurant (defaults to first owned)
      parameters:
        - { $ref: "#/components/parameters/SellerRestaurantQuery" }
      responses:
        "200":
          description: Restaurant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }
    put:
      tags: [seller]
      summary: Update a seller's restaurant
      parameters:
        - { $ref: "#/components/parameters/SellerRestaurantQuery" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Restaurant" }
      responses:
        "200":
          description: Updated restaurant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restaurant" }

  /api/v1/seller/restaurant/status:
    patch:
      tags: [seller]
      summary: Toggle a restaurant open/closed
      parameters:
